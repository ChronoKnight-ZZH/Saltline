<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTS 四模式真机测试 · Saltline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f12;
        --panel: #151c22;
        --line: #25313a;
        --text: #d7e2ea;
        --dim: #7d8f9c;
        --ok: #3ddc97;
        --bad: #ff6b6b;
        --warn: #ffb84d;
        --accent: #6fb3ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: .04em; }
      .sub { color: var(--dim); margin: 0 0 18px; }
      .box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .box h2 { font-size: 13px; margin: 0 0 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
      .diag { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: Consolas, monospace; font-size: 12.5px; }
      .diag b { color: var(--accent); font-weight: 600; }
      .voices { margin-top: 10px; font-family: Consolas, monospace; font-size: 12px; color: var(--dim); max-height: 120px; overflow: auto; }
      .voices span { display: inline-block; margin: 0 12px 4px 0; }
      .voices .en { color: var(--ok); }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card h3 { margin: 0; font-size: 15px; }
      .tag { color: var(--dim); font-size: 12px; margin-top: -4px; }
      .brief {
        font-family: Consolas, monospace;
        font-size: 12.5px;
        color: #b9c9d4;
        background: #10161b;
        border-left: 3px solid var(--line);
        padding: 8px 10px;
        border-radius: 4px;
        min-height: 54px;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit;
        color: var(--text);
        background: #1d262e;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.primary { background: #1b3a2e; border-color: #2c5f4b; }
      button:hover { border-color: var(--accent); }
      .result { font-family: Consolas, monospace; font-size: 12.5px; min-height: 22px; color: var(--dim); }
      .pass { color: var(--ok); }
      .fail { color: var(--bad); }
      .pending { color: var(--warn); }
      .log {
        font-family: Consolas, monospace;
        font-size: 12px;
        background: #0e1317;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        color: #93a6b3;
      }
      .hint { color: var(--dim); font-size: 12px; }
      @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>TTS 四模式真机测试</h1>
    <p class="sub">
      在本页点击卡片按钮会走<span style="color:var(--accent)">与 DEPLOY 完全相同的调用链</span>
      （<code>briefText()</code> → <code>speakBriefing()</code>，在 click 回调内同步执行）。
      所以必须用鼠标点击，不能自动运行——浏览器要求 TTS 处于用户手势内。请先确认系统音量未静音。
    </p>

    <div class="box">
      <h2>环境诊断</h2>
      <div class="diag" id="diag"></div>
      <div class="voices" id="voices"></div>
    </div>

    <div class="box" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="primary" id="run-all">一键跑完四个模式（依次播报）</button>
      <button id="clear-log">清空日志</button>
      <button id="native-probe">原生最小播报（绕过全部包装）</button>
      <span class="hint" id="summary"></span>
      <span style="flex-basis:100%"></span>
      <strong class="hint" style="color:var(--accent)">对照实验：</strong>
      <label class="hint"><input type="radio" name="variant" value="normal" checked /> 原样（cancel→speak 同帧）</label>
      <label class="hint"><input type="radio" name="variant" value="nocancel" /> 跳过 cancel()</label>
      <label class="hint"><input type="radio" name="variant" value="delay" /> cancel() 后延迟 30ms 再 speak</label>
      <span class="hint" style="flex-basis:100%">三条都失败 = 浏览器/系统层面问题（音量、输出设备、语音引擎）；只有「原样」失败 = cancel→speak 同帧缺陷。</span>
    </div>

    <div class="box" id="native-box" hidden>
      <h2>原生最小播报结果</h2>
      <div class="result" id="native-result"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="box" style="margin-top:16px">
      <h2>事件日志（play / speak / cancel / start / end / error）</h2>
      <div class="log" id="log"></div>
    </div>

    <script type="module">
      import { LANES, LANE_ORDER, briefText, speakBriefing, ttsSupported } from "../src/ui/menus.js";

      const synth = window.speechSynthesis;
      const RealUtterance = window.SpeechSynthesisUtterance;
      // 在任何包装之前抓住原生方法，供「原生最小播报」对照用。
      const rawSpeak = ttsSupported() ? synth.speak.bind(synth) : null;
      const rawCancel = ttsSupported() ? synth.cancel.bind(synth) : null;

      // ---- 记录与仪表：包一层构造器/方法，捕获真实引擎事件 --------------
      const record = { calls: [], utterances: [], last: null };
      let t0 = 0;
      let variant = "normal"; // normal | nocancel | delay

      document.querySelectorAll('input[name="variant"]').forEach((el) => {
        el.addEventListener("change", () => {
          if (el.checked) {
            variant = el.value;
            log(`对照实验切换：${variant}`);
          }
        });
      });

      function log(msg) {
        const stamp = ((performance.now() - t0) / 1000).toFixed(2).padStart(6, " ");
        const el = document.getElementById("log");
        el.textContent += `[${stamp}s] ${msg}\n`;
        el.scrollTop = el.scrollHeight;
      }

      function resetRecord() {
        record.calls.length = 0;
        record.utterances.length = 0;
        record.last = null;
        t0 = performance.now();
      }

      if (ttsSupported()) {
        const Wrapped = function (text) {
          const u = new RealUtterance(String(text));
          const rec = { text: String(text), created: performance.now(), start: null, end: null, error: null, utter: u };
          record.utterances.push(rec);
          record.last = rec;
          u.onstart = () => {
            rec.start = performance.now();
            log(`start  «${rec.text.slice(0, 40)}» voice=${u.voice ? u.voice.name : "(default)"}`);
          };
          u.onend = () => {
            rec.end = performance.now();
            log("end");
          };
          u.onerror = (e) => {
            rec.error = (e && e.error) || "error";
            log("error  " + rec.error);
          };
          return u;
        };
        Wrapped.prototype = RealUtterance.prototype;
        window.SpeechSynthesisUtterance = Wrapped;

        const realSpeak = synth.speak.bind(synth);
        synth.speak = (u) => {
          record.calls.push({ op: "speak", text: u.text });
          log(`speak  ${u.voice ? u.voice.name : "(default voice)"} rate=${u.rate} pitch=${u.pitch} vol=${u.volume}`);
          if (variant === "delay") {
            // 模拟修复方案：cancel 之后隔一个任务再真正排队
            log("speak 推迟 30ms（对照实验）");
            setTimeout(() => realSpeak(u), 30);
            return;
          }
          return realSpeak(u);
        };
        const realCancel = synth.cancel.bind(synth);
        synth.cancel = () => {
          record.calls.push({ op: "cancel" });
          if (variant === "nocancel") {
            log("cancel(skipped)");
            return;
          }
          log("cancel");
          return realCancel();
        };
      }

      // ---- 诊断面板 -------------------------------------------------------
      function renderDiag() {
        const list = ttsSupported() ? synth.getVoices() || [] : [];
        const en = list.filter((v) => /^en(-|_|$)/i.test(String(v.lang || "")));
        const localEn = en.filter((v) => v.localService);
        document.getElementById("diag").innerHTML = [
          `speechSynthesis: <b>${ttsSupported() ? "可用" : "不可用"}</b>`,
          `语音总数: <b>${list.length}</b>`,
          `英文语音: <b>${en.length}</b>（本地 ${localEn.length}）`,
          `speaking: <b>${ttsSupported() ? synth.speaking : "-"}</b>`,
          `pending: <b>${ttsSupported() ? synth.pending : "-"}</b>`,
          `paused: <b>${ttsSupported() ? synth.paused : "-"}</b>`,
          `安全上下文: <b>${window.isSecureContext ? "是" : "否"}</b>`,
        ].join("");
        document.getElementById("voices").innerHTML = list
          .map((v) => {
            const isEn = /^en(-|_|$)/i.test(String(v.lang || ""));
            return `<span class="${isEn ? "en" : ""}">${v.name} · ${v.lang}${v.localService ? " · local" : ""}</span>`;
          })
          .join("");
        document.getElementById("summary").textContent = list.length
          ? ""
          : "语音列表为空（可能仍在异步加载，稍后再测一次）";
      }

      // ---- 每张卡片 -------------------------------------------------------
      const cards = new Map(); // lane -> { getCell } 供一键测试复用

      for (const laneKey of LANE_ORDER) {
        const lane = LANES[laneKey];
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <h3>${lane.label}</h3>
          <div class="tag">${lane.tagline} · ${lane.cells.length} 格</div>
          <div class="brief" data-brief></div>
          <div class="row">
            <button class="primary" data-run>播放并记录（模拟 DEPLOY）</button>
            <button data-reroll>重抽一格</button>
          </div>
          <div class="result" data-result>尚未测试</div>
        `;
        document.getElementById("grid").appendChild(el);

        let cell = lane.cells[Math.floor(Math.random() * lane.cells.length)];
        const briefEl = el.querySelector("[data-brief]");
        const resultEl = el.querySelector("[data-result]");

        function refreshBrief() {
          briefEl.textContent = briefText(cell[0], cell[1], laneKey);
        }

        cards.set(laneKey, {
          el,
          cell: () => cell,
          run: (waitMs = 1500) => runLane(laneKey, cell, resultEl, waitMs),
        });

        el.querySelector("[data-reroll]").addEventListener("click", () => {
          cell = lane.cells[Math.floor(Math.random() * lane.cells.length)];
          refreshBrief();
          resultEl.className = "result";
          resultEl.textContent = "已换格，尚未播放";
        });

        el.querySelector("[data-run]").addEventListener("click", () => {
          cards.get(laneKey).run();
        });

        refreshBrief();
      }

      async function runLane(laneKey, cell, resultEl, waitMs = 1500) {
        resetRecord();
        resultEl.className = "result pending";
        resultEl.textContent = "播报中…（等待 onstart）";

        const text = briefText(cell[0], cell[1], laneKey);
        log(`— 测试 ${LANES[laneKey].label}：${cell[0]} + ${cell[1]}`);
        const ok = speakBriefing(text);

        if (!ok) {
          resultEl.className = "result fail";
          resultEl.textContent = "FAIL：speakBriefing 返回 false（无 API 或抛错）";
          return { lane: laneKey, ok: false, reason: "speakBriefing 返回 false" };
        }

        await new Promise((r) => setTimeout(r, waitMs));

        const rec = record.last;
        const elapsed = rec && rec.start ? Math.round(rec.start - rec.created) : null;
        const order = record.calls.map((c) => c.op).join(" → ");

        if (rec && rec.error) {
          resultEl.className = "result fail";
          resultEl.textContent = `FAIL：引擎报错 ${rec.error}（${order}）`;
          return { lane: laneKey, ok: false, reason: "error " + rec.error };
        }
        if (rec && rec.start) {
          resultEl.className = "result pass";
          resultEl.textContent =
            `PASS：${elapsed}ms 开始发声${rec.end ? `，${Math.round(rec.end - rec.start)}ms 播完` : "（仍在播放）"}` +
            ` · voice=${rec.utter.voice ? rec.utter.voice.name : "(default)"} · ${order} · variant=${variant}`;
          return { lane: laneKey, ok: true, elapsed };
        }

        resultEl.className = "result fail";
        resultEl.textContent =
          `FAIL：${waitMs}ms 内没有 onstart（speak 已调用，但引擎未开始）` +
          ` · ${order} · speaking=${synth.speaking} pending=${synth.pending} paused=${synth.paused}`;
        return { lane: laneKey, ok: false, reason: "no onstart" };
      }

      document.getElementById("run-all").addEventListener("click", async () => {
        const results = [];
        for (const laneKey of LANE_ORDER) {
          const card = cards.get(laneKey);
          results.push(await card.run(1200));
          await new Promise((r) => setTimeout(r, 400));
        }
        const passed = results.filter((r) => r.ok).length;
        document.getElementById("summary").className = "hint";
        document.getElementById("summary").textContent =
          passed === results.length
            ? `全部通过：${passed}/${results.length}`
            : `失败 ${results.length - passed}/${results.length}：` +
              results.filter((r) => !r.ok).map((r) => LANES[r.lane].label + "(" + r.reason + ")").join("，");
      });

      document.getElementById("clear-log").addEventListener("click", () => {
        document.getElementById("log").textContent = "";
        t0 = performance.now();
      });

      async function nativeProbe(label, text, opts = {}) {
        return new Promise((resolve) => {
          const u = new RealUtterance(text);
          if (opts.voice) u.voice = opts.voice;
          if (opts.lang) u.lang = opts.lang;
          u.rate = opts.rate ?? 1;
          u.pitch = opts.pitch ?? 1;
          u.volume = opts.volume ?? 1;
          const events = [];
          const done = (r) => resolve({ label, text, events, ...r });
          u.onstart = () => {
            events.push("start");
            log(`native/${label} start`);
          };
          u.onend = () => {
            events.push("end");
            log(`native/${label} end`);
            done({});
          };
          u.onerror = (e) => {
            events.push("error:" + ((e && e.error) || "?"));
            log(`native/${label} error ${(e && e.error) || "?"}`);
            done({});
          };
          try {
            rawSpeak(u);
          } catch (err) {
            events.push("throw:" + err.message);
            done({});
            return;
          }
          setTimeout(() => done({ timeout: true }), 1500);
        });
      }

      document.getElementById("native-probe").addEventListener("click", async () => {
        const box = document.getElementById("native-box");
        const out = document.getElementById("native-result");
        box.hidden = false;
        out.className = "result pending";
        out.textContent = "原生播报中…";
        const list = synth.getVoices() || [];
        const enVoices = list.filter((v) => /^en(-|_|$)/i.test(String(v.lang || "")));
        const zh = list.find((v) => /^zh(-|_|$)/i.test(String(v.lang || "")));

        const results = [];
        results.push(await nativeProbe("默认设置", "Hello. Native speech test, default settings."));
        if (enVoices[0]) {
          results.push(
            await nativeProbe("英文语音", "Hello. Native speech test with an English voice.", {
              voice: enVoices[0],
              lang: "en-US",
            }),
          );
        }
        if (zh) {
          results.push(await nativeProbe("中文语音", "你好，这是原生中文语音测试。", { voice: zh, lang: "zh-CN" }));
        }
        const anyStart = results.some((r) => r.events.includes("start"));
        out.className = "result " + (anyStart ? "pass" : "fail");
        out.textContent = results
          .map((r) => `${r.label}：${r.events.join(",") || "无事件"}${r.timeout ? "（超时无事件）" : ""}`)
          .join(" ｜ ") + (anyStart ? " ｜ 结论：原生可发声" : " ｜ 结论：原生同样不出声（浏览器/系统层面）");
      });

      renderDiag();
      // 语音列表常常异步加载；监听 voiceschanged 后刷新诊断。
      try {
        synth.addEventListener("voiceschanged", renderDiag);
      } catch {
        synth.onvoiceschanged = renderDiag;
      }
      setTimeout(renderDiag, 600);
      setTimeout(renderDiag, 1600);

      // 供控制台手动排查：__ttsTest.run("recon") / __ttsTest.synth
      window.__ttsTest = {
        record,
        synth,
        run: (laneKey) => cards.get(laneKey).run(),
        briefText,
        LANES,
      };
    </script>
  </body>
</html>
