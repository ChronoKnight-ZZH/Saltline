<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>直升机单位验证 Demo · 巡逻 / 警觉 / 齐射 / 爆炸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: "Consolas", "Microsoft YaHei", monospace; color: #cdd6e0; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel {
    position: fixed; top: 12px; left: 12px; width: 268px;
    background: rgba(14,20,28,0.88); border: 1px solid #243447; border-radius: 8px;
    padding: 12px 14px; font-size: 12px; line-height: 1.5; backdrop-filter: blur(4px);
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  .panel h2 { font-size: 13px; color: #6fb3ff; margin-bottom: 8px; letter-spacing: 1px; }
  .panel h3 { font-size: 12px; color: #9fb3c8; margin: 10px 0 4px; border-top: 1px solid #1e2c3c; padding-top: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; }
  .row label { color: #8fa4bb; }
  .row input[type=range] { width: 120px; }
  .row .val { color: #ffd479; min-width: 42px; text-align: right; }
  .btn {
    display: inline-block; background: #1d2c3f; color: #cfe3ff;
    border: 1px solid #2f4a6a; border-radius: 5px; padding: 5px 10px; margin: 3px 4px 3px 0;
    cursor: pointer; font-size: 12px; user-select: none;
  }
  .btn:hover { background: #29405c; }
  .btn.active { background: #2b5a8c; border-color: #4a86c8; color: #fff; }
  .stat { display: flex; justify-content: space-between; }
  .stat b { color: #7fd4a0; font-weight: normal; }
  #mode-badge { font-weight: bold; }
  .legend { color: #6a7d92; font-size: 11px; margin-top: 8px; line-height: 1.6; }
  .kbd { background:#22303f; border-radius:3px; padding:0 4px; color:#bcd; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: #6a7d92; font-size: 12px; }
  .flash-warn { color:#ff6b5e !important; }
</style>
</head>
<body>
<div id="app"></div>

<div class="panel">
  <h2>直升机单位验证</h2>
  <div class="stat"><span>状态机</span><b id="mode-badge">patrol</b></div>
  <div class="stat"><span>锁定进度</span><b id="lock-prog">0.00 / 1.20s</b></div>
  <div class="stat"><span>预警剩余</span><b id="tele-prog">—</b></div>
  <div class="stat"><span>在飞导弹</span><b id="msl-count">0</b></div>
  <div class="stat"><span>玩家血量</span><b id="hp">100</b></div>
  <div class="stat"><span>冷却剩余</span><b id="cd">0.0s</b></div>
  <div class="stat"><span>累计爆炸</span><b id="booms">0</b></div>

  <h3>操作</h3>
  <div class="row"><button class="btn" id="btn-force">强制锁定齐射</button><button class="btn" id="btn-reset">复位</button></div>
  <div class="row"><button class="btn active" id="btn-auto">自动 AI</button><button class="btn" id="btn-pause">暂停</button></div>

  <h3>调参（实时生效）</h3>
  <div class="row"><label>锁定时长</label><input type="range" id="p-lock" min="0.3" max="3" step="0.1" value="1.2"><span class="val" id="v-lock">1.2s</span></div>
  <div class="row"><label>预警时长</label><input type="range" id="p-tele" min="0.2" max="2.5" step="0.1" value="0.9"><span class="val" id="v-tele">0.9s</span></div>
  <div class="row"><label>导弹速度</label><input type="range" id="p-mspd" min="10" max="60" step="1" value="26"><span class="val" id="v-mspd">26</span></div>
  <div class="row"><label>齐射数量</label><input type="range" id="p-mcnt" min="1" max="6" step="1" value="2"><span class="val" id="v-mcnt">2</span></div>
  <div class="row"><label>爆炸半径</label><input type="range" id="p-blast" min="2" max="12" step="0.5" value="5"><span class="val" id="v-blast">5m</span></div>
  <div class="row"><label>爆心伤害</label><input type="range" id="p-dmg" min="10" max="80" step="5" value="30"><span class="val" id="v-dmg">30</span></div>
  <div class="row"><label>盘旋半径</label><input type="range" id="p-orbit" min="10" max="40" step="1" value="18"><span class="val" id="v-orbit">18m</span></div>
  <div class="row"><label>光柱锥角</label><input type="range" id="p-cone" min="0.08" max="0.5" step="0.02" value="0.18"><span class="val" id="v-cone">0.18</span></div>

  <div class="legend">
    <span class="kbd">拖拽</span> 旋转视角 · <span class="kbd">滚轮</span> 缩放<br>
    <span class="kbd">WASD</span> 移动地面小人（躲弹）<br>
    直升机照到小人→警觉→锁定→红标预警→齐射。<br>
    导弹打<b style="color:#ffd479">锁定瞬间的落点</b>，不追踪，跑出红圈即可躲。
  </div>
</div>
<div id="hint">导弹落地 = fx.explosion 视觉 + combat.explode 范围伤害（对玩家 50% 衰减）</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.180.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

// ===== 参数（与生产 HELI_COMBAT 对齐）=====
const P = {
  lockOnTime: 1.2, telegraphTime: 0.9, missileCount: 2, missileInterval: 0.35,
  missileSpeed: 26, spreadOffset: 1.5, reEngageCooldown: 6,
  blastRadius: 5, blastDamage: 30, orbitRadius: 18, orbitHeight: 22,
  orbitSpeed: 0.35, beamHalfAngle: 0.18, beamRange: 45,
};

// ===== 场景 =====
const app = document.getElementById("app");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.012);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(34, 26, 40);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x202833, 0.55));
const moon = new THREE.DirectionalLight(0xbcd0ff, 0.6);
moon.position.set(-30, 40, 20);
scene.add(moon);

// 地面网格
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(60, 64),
  new THREE.MeshStandardMaterial({ color: 0x1a2230, roughness: 0.95 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const grid = new THREE.GridHelper(120, 60, 0x2a3a4e, 0x1c2836);
grid.position.y = 0.02;
scene.add(grid);

// 掩体箱（可躲光柱）
const boxes = [];
for (let i = 0; i < 5; i++) {
  const a = (i/5)*Math.PI*2;
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(4, 3.2, 4),
    new THREE.MeshStandardMaterial({ color: 0x2f3d4e, roughness: 0.8 })
  );
  box.position.set(Math.cos(a)*10, 1.6, Math.sin(a)*10);
  scene.add(box); boxes.push(box);
}

// ===== 玩家（地面小人）=====
const player = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4, 1.0, 6, 12),
  new THREE.MeshStandardMaterial({ color: 0x6fd4a0 })
);
player.position.set(4, 0.9, 4);
scene.add(player);
let hp = 100;

// ===== 直升机（程序化模型，对应 src/world/heli-model.js）=====
function buildHeli() {
  const g = new THREE.Group();
  const hull = new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness:0.6, metalness:0.35 });
  const trim = new THREE.MeshStandardMaterial({ color: 0x3d4752, roughness:0.7 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x7fb2d4, roughness:0.15, metalness:0.6, transparent:true, opacity:0.75 });
  const rot = new THREE.MeshStandardMaterial({ color: 0x14181c, roughness:0.5, metalness:0.5 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 20, 16), hull);
  body.scale.set(1,0.92,1.7); g.add(body);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.78,16,12,0,Math.PI*2,0,Math.PI*0.62), glass);
  canopy.position.set(0,0.12,1.25); canopy.rotation.x=-0.35; g.add(canopy);
  const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.28,3.4,12), trim);
  boom.rotation.x = Math.PI/2; boom.position.set(0,0.25,-2.9); g.add(boom);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.9,0.5), trim);
  fin.position.set(0,0.7,-4.4); g.add(fin);
  const tailRotor = new THREE.Group();
  tailRotor.add(new THREE.Mesh(new THREE.BoxGeometry(0.06,1.1,0.12), rot));
  tailRotor.position.set(0.18,0.6,-4.4); g.add(tailRotor);
  for (const s of [-1,1]) {
    const skid = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,2.6,8), trim);
    skid.rotation.x=Math.PI/2; skid.position.set(s*0.75,-0.95,0.1); g.add(skid);
    const pod = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.25,1.3), trim);
    pod.position.set(s*1.15,-0.15,0.3); g.add(pod);
  }
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.5,8), trim);
  mast.position.set(0,0.95,0); g.add(mast);
  const main = new THREE.Group(); main.position.set(0,1.2,0);
  for (let i=0;i<4;i++){
    const b = new THREE.Mesh(new THREE.BoxGeometry(4.4,0.04,0.22), rot);
    b.geometry = b.geometry.clone(); b.geometry.translate(2.2,0,0);
    b.rotation.y=(i/4)*Math.PI*2; main.add(b);
  }
  g.add(main);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8), new THREE.MeshBasicMaterial({color:0xfff2c8}));
  lamp.position.set(0,-0.85,0.6); g.add(lamp);
  return { g, main, tailRotor };
}
const heli = buildHeli();
scene.add(heli.g);

// 光柱（锥体 + 地面光斑）
const beamMat = new THREE.MeshBasicMaterial({ color:0xfff2c8, transparent:true, opacity:0.08, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, fog:false });
const beam = new THREE.Mesh(new THREE.ConeGeometry(0.5,1,28,1,true), beamMat);
scene.add(beam);
const spot = new THREE.SpotLight(0xfff2c8, 8, P.beamRange, P.beamHalfAngle, 0.35, 1.2);
scene.add(spot); scene.add(spot.target);
const decal = new THREE.Mesh(new THREE.CircleGeometry(1,28).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0xfff2c8, transparent:true, opacity:0.32, depthWrite:false, fog:false }));
decal.position.y = 0.04; scene.add(decal);

// 地面红标（telegraph 预警圈）
const marker = new THREE.Mesh(new THREE.RingGeometry(0.6,1,32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0xff4a3a, transparent:true, opacity:0.9, depthWrite:false }));
marker.position.y = 0.06; marker.visible = false; scene.add(marker);

// ===== 状态机 =====
const S = {
  mode: "patrol", lockT: 0, telegraphT: 0, volleyLeft: 0, volleyT: 0,
  cooldownT: 0, orbitA: 0, lockPoint: new THREE.Vector3(),
  pos: new THREE.Vector3(), beamDir: new THREE.Vector3(0.18,-1,0).normalize(),
  beamOrigin: new THREE.Vector3(),
};
let missiles = [];
let explosions = [];
let boomCount = 0;
let paused = false;
let autoAI = true;
let lastT = performance.now();

function isInBeam(target) {
  const tmp = target.clone().sub(S.beamOrigin);
  const d = tmp.length();
  if (d > P.beamRange+0.3 || d < 1e-6) return false;
  tmp.multiplyScalar(1/d);
  if (tmp.dot(S.beamDir) < Math.cos(P.beamHalfAngle)) return false;
  return true; // 简化：无掩体遮挡射线（Demo）
}

function orientCone(origin, dir, range, half) {
  beam.position.copy(origin).addScaledVector(dir, range/2);
  const r = Math.tan(half)*range;
  beam.scale.set(r*2, range, r*2);
  const axis = dir.clone().cross(new THREE.Vector3(0,1,0));
  const s = axis.length();
  if (s < 1e-8) beam.quaternion.setFromAxisAngle(new THREE.Vector3(1,0,0), dir.y>0?Math.PI:0);
  else beam.quaternion.setFromAxisAngle(axis.multiplyScalar(1/s), Math.acos(-dir.y));
}

function fireMissile() {
  const idx = P.missileCount - S.volleyLeft;
  const target = S.lockPoint.clone();
  if (idx>0){ target.x+=(Math.random()*2-1)*P.spreadOffset; target.z+=(Math.random()*2-1)*P.spreadOffset; }
  const origin = S.pos.clone(); origin.y-=0.8;
  // 弹体
  const mg = new THREE.Group();
  const bm = new THREE.MeshStandardMaterial({color:0x6b7078, metalness:0.7, roughness:0.4});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1,8), bm);
  body.rotation.x=Math.PI/2; mg.add(body);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.08,0.28,8), new THREE.MeshBasicMaterial({color:0xc4452f}));
  tip.rotation.x=Math.PI/2; tip.position.z=0.62; mg.add(tip);
  mg.position.copy(origin); scene.add(mg);
  const dir = target.clone().sub(origin); const dist = dir.length(); dir.normalize();
  missiles.push({ mesh:mg, pos:origin.clone(), target, dir, dist, traveled:0 });
}

function explode(pos) {
  boomCount++;
  // fx.explosion 视觉：闪光球 + 冲击环 + 火花
  const flash = new THREE.Mesh(new THREE.SphereGeometry(1,16,12),
    new THREE.MeshBasicMaterial({color:0xffd27a, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false}));
  flash.position.copy(pos); flash.position.y+=0.6; scene.add(flash);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2,1,40).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({color:0xff9a4a, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  ring.position.copy(pos); ring.position.y=0.08; scene.add(ring);
  explosions.push({ flash, ring, t:0 });
  // combat.explode 范围伤害：对玩家 50% 衰减（dist<r）
  const d = player.position.clone().setY(player.position.y+0.2).distanceTo(pos.clone().setY(pos.y+0.6));
  if (d < P.blastRadius) {
    const dmg = P.blastDamage*0.5*(1-d/P.blastRadius);
    hp = Math.max(0, hp-dmg);
    hpEl.classList.add("flash-warn"); setTimeout(()=>hpEl.classList.remove("flash-warn"), 300);
  }
}

// ===== 更新 =====
const hpEl = document.getElementById("hp");
const modeEl = document.getElementById("mode-badge");
const keys = {};
addEventListener("keydown", e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);

function update(dt) {
  // 玩家移动
  const sp = 7*dt;
  if (keys.w) player.position.z-=sp;
  if (keys.s) player.position.z+=sp;
  if (keys.a) player.position.x-=sp;
  if (keys.d) player.position.x+=sp;
  player.position.x = THREE.MathUtils.clamp(player.position.x, -55, 55);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -55, 55);

  // 盘旋
  const spdMul = (S.mode==="alert"||S.mode==="lock")?0.6:1;
  S.orbitA += P.orbitSpeed*spdMul*dt;
  const cx=0, cz=0;
  S.pos.set(cx+Math.cos(S.orbitA)*P.orbitRadius, P.orbitHeight+Math.sin(S.orbitA*2.3)*1.5, cz+Math.sin(S.orbitA)*P.orbitRadius);
  heli.g.position.copy(S.pos);
  heli.g.rotation.y = Math.atan2(player.position.x-S.pos.x, player.position.z-S.pos.z);
  heli.g.rotation.x = S.mode==="lock"?0.12:0.04;
  heli.main.rotation.y += dt*18;
  heli.tailRotor.rotation.z += dt*28;

  // 光柱：patrol 扫 / alert+lock 指向玩家
  S.beamOrigin.copy(S.pos); S.beamOrigin.y-=0.5;
  if (S.mode==="alert"||S.mode==="lock"||S.mode==="engage") {
    S.beamDir.copy(player.position).sub(S.beamOrigin).normalize();
  } else {
    S.beamDir.set(0.18,-1,0).normalize().applyAxisAngle(new THREE.Vector3(0,1,0), S.orbitA*1.3);
  }
  spot.position.copy(S.beamOrigin);
  spot.target.position.copy(S.beamOrigin).addScaledVector(S.beamDir, P.beamRange);
  spot.angle = P.beamHalfAngle;
  orientCone(S.beamOrigin, S.beamDir, P.beamRange, P.beamHalfAngle);
  // 光斑
  const t = -S.beamOrigin.y/S.beamDir.y;
  decal.position.copy(S.beamOrigin).addScaledVector(S.beamDir, t); decal.position.y=0.04;
  decal.scale.setScalar(Math.tan(P.beamHalfAngle)*t*1.1);

  // 状态机
  if (autoAI) {
    S.cooldownT = Math.max(0, S.cooldownT-dt);
    const exposed = isInBeam(player.position);
    switch(S.mode){
      case "patrol":
        S.lockT=0;
        if (exposed && S.cooldownT<=0) S.mode="alert";
        break;
      case "alert":
        if (!exposed){ S.mode="patrol"; S.lockT=0; }
        else { S.lockT+=dt;
          if (S.lockT>=P.lockOnTime){ S.mode="lock"; S.telegraphT=P.telegraphTime; S.lockPoint.copy(player.position); S.lockPoint.y=0; }
        }
        break;
      case "lock":
        S.telegraphT-=dt;
        if (S.telegraphT<=0){ S.mode="engage"; S.volleyLeft=P.missileCount; S.volleyT=0; }
        break;
      case "engage":
        S.volleyT-=dt;
        if (S.volleyLeft>0 && S.volleyT<=0){ fireMissile(); S.volleyLeft--; S.volleyT=P.missileInterval; }
        if (S.volleyLeft<=0){ S.mode="cooldown"; S.cooldownT=P.reEngageCooldown; S.lockT=0; }
        break;
      case "cooldown":
        if (S.cooldownT<=0) S.mode="patrol";
        break;
    }
  }

  // 红标：lock/engage 时显示锁定点
  if (S.mode==="lock"||S.mode==="engage") {
    marker.visible=true;
    marker.position.set(S.lockPoint.x,0.06,S.lockPoint.z);
    marker.scale.setScalar(P.blastRadius);
    marker.material.opacity = 0.5+0.5*Math.sin(performance.now()*0.02);
  } else marker.visible=false;

  // 导弹
  for (let i=missiles.length-1;i>=0;i--){
    const m=missiles[i];
    const step=P.missileSpeed*dt;
    m.traveled+=step; m.pos.addScaledVector(m.dir,step);
    m.mesh.position.copy(m.pos);
    m.mesh.rotation.set(Math.asin(-m.dir.y), Math.atan2(m.dir.x,m.dir.z), 0, "YXZ");
    if (m.traveled>=m.dist){
      scene.remove(m.mesh);
      explode(m.target);
      missiles.splice(i,1);
    }
  }

  // 爆炸动画
  for (let i=explosions.length-1;i>=0;i--){
    const e=explosions[i]; e.t+=dt;
    const k=e.t/0.6;
    e.flash.scale.setScalar(1+k*P.blastRadius*0.9);
    e.flash.material.opacity=Math.max(0,0.95-k);
    e.ring.scale.setScalar(1+k*P.blastRadius);
    e.ring.material.opacity=Math.max(0,0.8-k);
    if (e.t>0.6){ scene.remove(e.flash); scene.remove(e.ring); explosions.splice(i,1); }
  }

  // HUD
  modeEl.textContent=S.mode;
  modeEl.className = (S.mode==="lock"||S.mode==="engage")?"flash-warn":"";
  document.getElementById("lock-prog").textContent=`${S.lockT.toFixed(2)} / ${P.lockOnTime.toFixed(2)}s`;
  document.getElementById("tele-prog").textContent = S.mode==="lock"?S.telegraphT.toFixed(2)+"s":"—";
  document.getElementById("msl-count").textContent=missiles.length;
  hpEl.textContent=hp.toFixed(0);
  document.getElementById("cd").textContent=S.cooldownT.toFixed(1)+"s";
  document.getElementById("booms").textContent=boomCount;
}

// ===== 相机轨道（拖拽/滚轮）=====
let camTheta=0.7, camPhi=0.6, camDist=55;
let dragging=false, lx=0, ly=0;
renderer.domElement.addEventListener("mousedown", e=>{dragging=true; lx=e.clientX; ly=e.clientY;});
addEventListener("mouseup", ()=>dragging=false);
addEventListener("mousemove", e=>{
  if(!dragging) return;
  camTheta -= (e.clientX-lx)*0.005; camPhi = THREE.MathUtils.clamp(camPhi-(e.clientY-ly)*0.005, 0.05, 1.5);
  lx=e.clientX; ly=e.clientY;
});
renderer.domElement.addEventListener("wheel", e=>{ camDist=THREE.MathUtils.clamp(camDist+e.deltaY*0.05, 15, 120); });
function updateCam(){
  camera.position.set(
    Math.sin(camTheta)*Math.cos(camPhi)*camDist,
    Math.sin(camPhi)*camDist,
    Math.cos(camTheta)*Math.cos(camPhi)*camDist
  );
  camera.lookAt(0,8,0);
}

// ===== 按钮 / 滑块 =====
function bind(id, key, fmt, after){
  const el=document.getElementById(id), v=document.getElementById(id.replace("p-","v-"));
  el.addEventListener("input", ()=>{ P[key]=parseFloat(el.value); v.textContent=fmt?fmt(P[key]):P[key]; if(after)after(); });
}
bind("p-lock","lockOnTime",v=>v.toFixed(1)+"s");
bind("p-tele","telegraphTime",v=>v.toFixed(1)+"s");
bind("p-mspd","missileSpeed");
bind("p-mcnt","missileCount");
bind("p-blast","blastRadius",v=>v+"m");
bind("p-dmg","blastDamage");
bind("p-orbit","orbitRadius",v=>v+"m");
bind("p-cone","beamHalfAngle");

document.getElementById("btn-force").onclick=()=>{
  S.mode="lock"; S.telegraphT=P.telegraphTime;
  S.lockPoint.copy(player.position); S.lockPoint.y=0;
};
document.getElementById("btn-reset").onclick=()=>{
  S.mode="patrol"; S.lockT=0; S.cooldownT=0; S.volleyLeft=0; hp=100;
  for(const m of missiles) scene.remove(m.mesh); missiles=[];
  marker.visible=false;
};
const autoBtn=document.getElementById("btn-auto");
autoBtn.onclick=()=>{ autoAI=!autoAI; autoBtn.classList.toggle("active",autoAI); autoBtn.textContent=autoAI?"自动 AI":"手动"; };
const pauseBtn=document.getElementById("btn-pause");
pauseBtn.onclick=()=>{ paused=!paused; pauseBtn.classList.toggle("active",paused); pauseBtn.textContent=paused?"继续":"暂停"; };

addEventListener("resize", ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});

function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000, 0.05); lastT=now;
  if(!paused) update(dt);
  updateCam();
  renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
