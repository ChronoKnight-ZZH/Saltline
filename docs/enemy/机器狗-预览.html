<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ===================== 模型核心 ===================== */
/* ============================================================
 * 机器狗模型核心（把 minified 源码还原为可读实现）
 * 依赖：全局 THREE
 * ============================================================ */

const va = Math.PI / 2;

/* ---------- 几何/材质辅助函数（还原 minified 原名） ---------- */
function Ce(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = null) {
  if (s) geo.scale(s[0], s[1], s[2]);
  if (rx) geo.rotateX(rx);
  if (ry) geo.rotateY(ry);
  if (rz) geo.rotateZ(rz);
  geo.translate(x, y, z);
  return geo;
}

/** 倒角盒（用 BoxGeometry 近似） */
function ft(w, h, d, bevel = 0.01, anchor = "center") {
  const g = new THREE.BoxGeometry(w, h, d);
  if (anchor === "bottom") g.translate(0, h / 2, 0);
  return g;
}

/** 圆柱/圆台 */
function ds(rTop, rBottom, h, seg = 12) {
  return new THREE.CylinderGeometry(rTop, rBottom, h, seg);
}

/** 普通圆柱 */
function Si(r1, r2, h, seg = 10) {
  return new THREE.CylinderGeometry(r1, r2, h, seg);
}

/** 沿 X 轴的圆管/圆环（外径、内径、长度） */
function Ro(outer, inner, length, seg = 8) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outer, 0, Math.PI * 2, false);
  if (inner > 0) {
    const hole = new THREE.Path();
    hole.absarc(0, 0, inner, 0, Math.PI * 2, true);
    shape.holes.push(hole);
  }
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: length,
    bevelEnabled: false,
    curveSegments: seg,
  });
  g.translate(0, 0, -length / 2);
  g.rotateY(Math.PI / 2);
  return g;
}

/** 椭球：半径 + 分段 + 三轴缩放 */
function Ur(r, wSeg = 16, hSeg = 10, sx = 1, sy = 1, sz = 1) {
  const g = new THREE.SphereGeometry(1, wSeg, hSeg);
  g.scale(r * sx, r * sy, r * sz);
  return g;
}

/** 锥形杆：从 a 到 b，半径 r1→r2 */
function su(a, b, r1, r2, seg = 8) {
  const A = new THREE.Vector3(...a);
  const B = new THREE.Vector3(...b);
  const dir = B.clone().sub(A);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r2, r1, len, seg, 1, false);
  g.translate(0, len / 2, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    dir.clone().normalize()
  );
  g.applyQuaternion(q);
  g.translate(A.x, A.y, A.z);
  return g;
}

/** 铆钉（沿 Y 的短圆柱） */
function Yv(x, y, z) {
  const g = new THREE.CylinderGeometry(0.007, 0.007, 0.008, 6);
  g.translate(x, y, z);
  return g;
}

/** 螺栓（沿 X 的短圆柱） */
function $_(x, y, z) {
  const g = new THREE.CylinderGeometry(0.0075, 0.0075, 0.014, 6);
  g.rotateZ(Math.PI / 2);
  g.translate(x, y, z);
  return g;
}

/** 螺栓（沿 Z 的短圆柱） */
function kC(x, y, z) {
  const g = new THREE.CylinderGeometry(0.009, 0.009, 0.012, 6);
  g.rotateX(Math.PI / 2);
  g.translate(x, y, z);
  return g;
}

/** 管线：点位数组 → 平滑管。签名 (points, radius, radialSegments) */
function tubeGeometry(points, radius, radialSegments = 6) {
  const curve = new THREE.CatmullRomCurve3(
    points.map((p) => new THREE.Vector3(p[0], p[1], p[2]))
  );
  const tubularSegments = Math.max(24, (points.length - 1) * 16);
  return new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
}

/* 兼容源码里直接传 [r,g,b] 的写法 */
function resolveMaterial(mat) {
  if (Array.isArray(mat)) {
    const [r, g, b] = mat;
    return new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) });
  }
  return mat;
}

/* ---------- 骨架构建器（还原 iu） ---------- */
class iu {
  constructor() {
    this.root = new THREE.Group();
    this.bones = new Map();
  }
  bone(name, parent, x, y, z) {
    const obj = new THREE.Group();
    obj.name = name;
    obj.position.set(x, y, z);
    if (parent) this.bones.get(parent).add(obj);
    else this.root.add(obj);
    this.bones.set(name, obj);
    return obj;
  }
  add(matName, boneName, geo, mat, cast = true) {
    const m = new THREE.Mesh(geo, resolveMaterial(mat));
    m.castShadow = cast;
    m.receiveShadow = false;
    this.bones.get(boneName).add(m);
    return m;
  }
  build() {
    this.root.traverse((o) => {
      if (o.isMesh) o.frustumCulled = false;
    });
    this.root.bones = this.bones;
    return this.root;
  }
}

    }
    (t("shell", a, Ce(ft(0.062, i.L1 - 0.07, 0.1, 0.022), 0, -i.L1 * 0.5 - 0.005, 0.004), Ss),
      t("metal", a, Ce(ft(0.044, i.L1 - 0.04, 0.06, 0.012), 0, -i.L1 * 0.5, -0.035), an),
      t("shell", a, Ce(ft(0.065, 0.045, 0.103, 0.01), 0, -0.145, 0.004), Ts),
      t("shell", a, Ce(ft(0.064, 0.012, 0.102, 0.004), 0, -0.26, 0.004), s0),
      t("metal", a, su([0, -0.06, -0.082], [0, -i.L1 * 0.62, -0.078], 0.021, 0.021, 10), Yn),
      t("metal", a, su([0, -i.L1 * 0.62, -0.078], [0, -i.L1 + 0.025, -0.058], 0.009, 0.009, 6), IC),
      t("metal", a, Ce(ft(0.05, 0.03, 0.035, 0.006), 0, -0.055, -0.07), As),
      t("shell", a, tubeGeometry([
        [o * 0.036, -0.02, 0.05],
        [o * 0.044, -0.13, 0.062],
        [o * 0.042, -0.28, 0.058],
        [o * 0.034, -i.L1 + 0.03, 0.035],
      ], 0.0065, 5), ga),
      t("metal", a, Ce(Ro(0.05, 0.05, 0.086, 14), 0, -i.L1, 0), an),
      t("shell", a, Ce(Ro(0.036, 0.036, 0.092, 12), 0, -i.L1, 0), vm),
      t("metal", l, Ce(ds(0.03, 0.021, i.L2 - 0.08, 10), 0, -(i.L2 - 0.08) / 2 - 0.01, 0), an),
      t("shell", l, Ce(ft(0.052, 0.21, 0.04, 0.014), 0, -0.14, 0.02), Ss),
      t("shell", l, Ce(ft(0.054, 0.02, 0.042, 0.006), 0, -0.215, 0.02), Ts),
      t("metal", l, Ce(ft(0.03, 0.06, 0.05, 0.008), 0, -0.02, -0.03), As),
      t("metal", l, Ce(ds(0.024, 0.03, 0.03, 10), 0, -i.L2 + 0.085, 0), Yn),
      t("shell", l, Ce(Ur(i.footR + 0.002, 12, 8, 1, 0.86, 1.08), 0, -i.L2 + i.footR * 0.86, 0.004), ga));
  }
  return e.build(["shell", "metal", "glow", "lens"]);
}
/* ===================== 场景 ===================== */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1114);
scene.fog = new THREE.Fog(0x0e1114, 6, 22);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.55, 1.05, 1.85);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0.02);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.7;
controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI * 0.495;

/* 灯光 */
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1c20, 1.05));

const sun = new THREE.DirectionalLight(0xfff4e6, 2.4);
sun.position.set(2.6, 4.2, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -1.6;
sun.shadow.camera.right = 1.6;
sun.shadow.camera.top = 1.8;
sun.shadow.camera.bottom = -1.2;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 12;
sun.shadow.bias = -0.0006;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x7fa8ff, 1.1);
rim.position.set(-3, 1.4, -2.6);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffd9b0, 0.5);
fill.position.set(-1, 0.6, 2.4);
scene.add(fill);

/* 地面 */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({ color: 0x14171a, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(8, 40, 0x3a4149, 0x23282e);
grid.position.y = 0.001;
scene.add(grid);

/* ===================== 实例化 ===================== */
const dog = createWalkerModel();
scene.add(dog);

document.getElementById("stat-mesh").textContent =
  (() => { let c = 0; dog.traverse(o => { if (o.isMesh) c++; }); return c; })();
document.getElementById("stat-bone").textContent = dog.bones.size;

/* 骨骼引用 */
const B = dog.bones;
const legNames = ["FL", "FR", "BL", "BR"];
const legs = legNames.map((n) => ({
  abd: B.get("abd" + n),
  thigh: B.get("thigh" + n),
  shin: B.get("shin" + n),
  // 对角小跑：FL+BR 同相，FR+BL 反相
  phase: (n === "FL" || n === "BR") ? 0 : Math.PI,
  side: (n === "FL" || n === "BL") ? 1 : -1,
}));

const bodyBone = B.get("body");
const neck = B.get("neck");
const head = B.get("head");
const turret = B.get("turret");
const gun = B.get("gun");
const antenna = B.get("antenna");
const beaconBone = B.get("beacon");

/* 顶灯脉冲（拿到 beacon 下的发光球） */
let beaconMesh = null;
beaconBone.traverse((o) => { if (o.isMesh && !beaconMesh) beaconMesh = o; });
const beaconLight = new THREE.PointLight(0xff8a2a, 2.2, 2.4, 2);
beaconLight.position.set(0, 0.02, 0);
beaconBone.add(beaconLight);

/* ===================== 步态动画 ===================== */
const state = {
  walking: true,
  speed: 1.0,      // 步频倍率
  gaitTime: 0,
  t: 0,
};

const clock = new THREE.Clock();
const SWING = 0.30;   // 髋摆动幅度（弧度）
const LIFT = 0.52;    // 抬腿时膝部弯曲幅度

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  state.t += dt;

  const moving = state.walking;
  const cadence = moving ? 3.1 * state.speed : 1.0;
  if (moving) state.gaitTime += dt * cadence;

  const g = state.gaitTime;

  /* --- 腿部：对角小跑 --- */
  for (const leg of legs) {
    if (!leg.abd) continue;

    if (moving) {
      const p = g + leg.phase;
      const swing = Math.sin(p);
      // 髋：前后摆
      leg.abd.rotation.x = -SWING * swing;
      // 膝：摆动相抬腿（sin(p) 上升段 → 屈膝）
      const lift = Math.max(0, Math.sin(p + Math.PI * 0.5));
      leg.shin.rotation.x = LIFT * lift * 0.9 + 0.12;
      leg.thigh.rotation.x = -0.10 * Math.max(0, swing);
      // 轻微外摆，避免机械感
      leg.abd.rotation.z = leg.side * 0.02 * Math.sin(p * 2);
    } else {
      // 待机：回到站姿，带一点呼吸感
      leg.abd.rotation.x += (0 - leg.abd.rotation.x) * Math.min(1, dt * 6);
      leg.abd.rotation.z += (0 - leg.abd.rotation.z) * Math.min(1, dt * 6);
      leg.shin.rotation.x += (0.10 - leg.shin.rotation.x) * Math.min(1, dt * 6);
      leg.thigh.rotation.x += (0 - leg.thigh.rotation.x) * Math.min(1, dt * 6);
    }
  }

  /* --- 机身起伏与俯仰 --- */
  const bob = moving ? Math.sin(g * 2) * 0.008 : Math.sin(state.t * 1.1) * 0.003;
  bodyBone.position.y = $v.stand + bob;
  bodyBone.rotation.z = moving ? Math.sin(g) * 0.012 : 0;
  bodyBone.rotation.x = moving ? Math.sin(g * 2 + 1) * 0.008 : 0;

  /* --- 颈部/头部：环视 --- */
  neck.rotation.y = Math.sin(state.t * 0.55) * 0.16;
  head.rotation.x = Math.sin(state.t * 0.8 + 0.6) * 0.06 - 0.02;
  head.rotation.z = Math.sin(state.t * 0.45) * 0.03;

  /* --- 顶部武器站：扫描 --- */
  turret.rotation.y = Math.sin(state.t * 0.42) * 0.55;
  gun.rotation.x = -0.12 + Math.sin(state.t * 0.9) * 0.12;

  /* --- 天线摇摆 --- */
  antenna.rotation.z = Math.sin(state.t * 2.3) * 0.05 - 0.02;
  antenna.rotation.x = Math.sin(state.t * 1.7 + 1) * 0.04;

  /* --- 警示灯脉冲 --- */
  const pulse = 0.55 + 0.45 * Math.pow(Math.max(0, Math.sin(state.t * 3.2)), 4);
  if (beaconMesh) {
    if (!beaconMesh.userData.baseColor) {
      beaconMesh.userData.baseColor = beaconMesh.material.color.clone();
    }
    beaconMesh.material.color
      .copy(beaconMesh.userData.baseColor)
      .multiplyScalar(0.45 + pulse * 0.9);
  }
  beaconLight.intensity = 0.6 + pulse * 3.4;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

/* ===================== 交互 ===================== */
addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    state.walking = !state.walking;
  }
  if (e.key === "g" || e.key === "G") {
    state.speed = state.speed >= 1.6 ? 0.6 : state.speed + 0.5;
  }
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 便于控制台调试 */
window.__dog = dog;
window.__state = state;
</script>
</body>
</html>
