<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>Drone Model Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 12px; bottom: 12px; color: #aaa;
    font: 13px/1.5 system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ============================================================
 * 1. 场景基础
 * ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
scene.fog = new THREE.Fog(0x1a1d22, 8, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.6, 1.0, 1.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

/* 灯光 */
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2a2a, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 5, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -2;
sun.shadow.camera.right = 2;
sun.shadow.camera.top = 2;
sun.shadow.camera.bottom = -2;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x88aaff, 0.8);
rim.position.set(-3, 1, -3);
scene.add(rim);

/* 地面网格 */
const grid = new THREE.GridHelper(6, 24, 0x444a55, 0x2a2f38);
grid.position.y = -0.55;
scene.add(grid);

/* ============================================================
 * 2. 最小几何/材质辅助函数（替代 Saltline 内部实现）
 * ============================================================ */
const va = Math.PI / 2;

function Ce(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = null) {
  if (s) geo.scale(s[0], s[1], s[2]);
  geo.rotateX(rx); geo.rotateY(ry); geo.rotateZ(rz);
  geo.translate(x, y, z);
  return geo;
}

/** 倒角盒：用 BoxGeometry 近似 */
function ft(w, h, d, bevel = 0.01, anchor = "center") {
  const g = new THREE.BoxGeometry(w, h, d);
  if (anchor === "bottom") g.translate(0, h / 2, 0);
  return g;
}

/** 圆柱/圆台 */
function ds(rTop, rBottom, h, seg = 12) {
  return new THREE.CylinderGeometry(rTop, rBottom, h, seg);
}

/** 圆管（沿 X 轴） */
function Ro(outer, inner, length, seg = 8) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, outer, 0, Math.PI * 2, false);
  if (inner > 0) {
    const hole = new THREE.Path();
    hole.absarc(0, 0, inner, 0, Math.PI * 2, true);
    shape.holes.push(hole);
  }
  const g = new THREE.ExtrudeGeometry(shape, { depth: length, bevelEnabled: false, curveSegments: seg });
  g.translate(0, 0, -length / 2);
  g.rotateY(Math.PI / 2);
  return g;
}

/** 椭球壳：用 SphereGeometry 缩放 */
function Ur(rx, wSeg = 20, hSeg = 12, ry = rx, rz = rx) {
  const g = new THREE.SphereGeometry(1, wSeg, hSeg);
  g.scale(rx, ry, rz);
  return g;
}

/** 锥形杆：从 a 到 b，半径 r1→r2 */
function su(a, b, r1, r2, seg = 8) {
  const A = new THREE.Vector3(...a);
  const B = new THREE.Vector3(...b);
  const dir = B.clone().sub(A);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r2, r1, len, seg, 1, false);
  g.translate(0, len / 2, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    dir.clone().normalize()
  );
  g.applyQuaternion(q);
  g.translate(A.x, A.y, A.z);
  return g;
}

/** 普通圆柱（简化版 Si） */
function Si(r1, r2, h, seg = 10) {
  return new THREE.CylinderGeometry(r1, r2, h, seg);
}

/** 圆环体（简化版 Yv） */
function Yv(x, y, z) {
  const g = new THREE.TorusGeometry(0.018, 0.004, 6, 12);
  g.rotateX(Math.PI / 2);
  g.translate(x, y, z);
  return g;
}

/** 共享桨毂几何 */
function FC() {
  return new THREE.CylinderGeometry(0.018, 0.022, 0.03, 8);
}

/* ============================================================
 * 3. 材质（替代 Saltline 的材质常量）
 * ============================================================ */
const MAT = {
  shell: new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.55, metalness: 0.15 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x2e3338, roughness: 0.4, metalness: 0.85 }),
  glow:  new THREE.MeshBasicMaterial({ color: 0x66ff88 }),
  lens:  new THREE.MeshPhysicalMaterial({ color: 0x0a0a0a, roughness: 0.05, metalness: 0.1, clearcoat: 1 }),
  disc:  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08, depthWrite: false, side: THREE.DoubleSide }),
  cone:  new THREE.MeshBasicMaterial({ color: 0xfff2cc, transparent: true, opacity: 0.12, depthWrite: false, side: THREE.DoubleSide }),
};

/* 兼容源码里的颜色数组材质参数 */
function resolveMaterial(mat) {
  if (Array.isArray(mat)) {
    const [r, g, b] = mat;
    return new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) });
  }
  return mat;
}

/* ============================================================
 * 4. 最小骨骼构建器（替代 iu）
 * ============================================================ */
class MiniRig {
  constructor() { this.root = new THREE.Group(); this.bones = new Map(); this.batches = new Map(); }
  bone(name, parent, x, y, z) {
    const obj = new THREE.Group();
    obj.name = name;
    obj.position.set(x, y, z);
    if (parent) this.bones.get(parent).add(obj);
    else this.root.add(obj);
    this.bones.set(name, obj);
    return obj;
  }
  add(matName, boneName, geo, mat, cast = true) {
    const m = new THREE.Mesh(geo, resolveMaterial(mat));
    m.castShadow = cast;
    m.receiveShadow = false;
    this.bones.get(boneName).add(m);
    return m;
  }
  build() {
    this.root.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
    return this.root;
  }
}

/* ============================================================
 * 5. 数据表 DRONE_MODEL（按原逻辑推断的占位值，可调）
 * ============================================================ */
const DRONE_MODEL = {
  rotors: [
    [ 0.33, 0.0,  0.30],
    [-0.33, 0.0,  0.30],
    [ 0.33, 0.0, -0.30],
    [-0.33, 0.0, -0.30],
  ],
  gimbal: [0, -0.07, 0.16],
  ball:   [0, -0.045, 0.045],
  lamp:   [0, 0, 0.06],
  gun:    [0, -0.075, 0.12],
};

/* ============================================================
 * 6. createDroneModel —— 移植你给的源码
 * ============================================================ */
function createDroneModel() {
  const i = DRONE_MODEL;
  const e = new MiniRig();
  const t = new MiniRig();
  const n = (l, c, u, h, f) => { e.bone(l, c, u, h, f); t.bone(l, c, u, h, f); };

  n("root", null, 0, 0, 0);
  n("body", "root", 0, 0, 0);
  for (let l = 0; l < 4; l++) n("rotor" + l, "body", i.rotors[l][0], i.rotors[l][1], i.rotors[l][2]);
  n("gimbalYaw", "body", i.gimbal[0], i.gimbal[1], i.gimbal[2]);
  n("ball", "gimbalYaw", i.ball[0], i.ball[1], i.ball[2]);
  n("lamp", "ball", i.lamp[0], i.lamp[1], i.lamp[2]);
  n("gun", "body", i.gun[0], i.gun[1], i.gun[2]);
  n("strobeG", "body", 0, 0, 0);
  n("strobeR", "body", 0, 0, 0);
  n("strobeW", "body", 0, 0, 0);

  const s = (l, c, u, h, f) => e.add(l, c, u, h, f);

  /* --- 机身 --- */
  s("shell", "body", Ce(Ur(0.118, 20, 12, 0.074, 0.27), 0, 0.02, 0), MAT.shell);
  s("shell", "body", Ce(new THREE.CylinderGeometry(1, 0.9, 1, 20), 0, 0.02, 0.165, va, 0, 0, [0.094, 0.05, 0.06]), MAT.shell);
  s("shell", "body", Ce(new THREE.CylinderGeometry(1, 1, 1, 20), 0, 0.02, -0.02, va, 0, 0, [0.121, 0.012, 0.0765]), MAT.shell);
  s("shell", "body", Ce(ft(0.118, 0.014, 0.2, 0.005), 0, 0.089, -0.03), MAT.shell);
  s("shell", "body", Ce(ft(0.03, 0.006, 0.2, 0.002), 0, 0.0975, -0.03), MAT.shell);

  for (const l of [-0.05, 0.05]) for (const c of [-0.12, 0.06]) s("metal", "body", Yv(l, 0.097, c), MAT.metal);

  s("metal", "body", Ce(ft(0.175, 0.06, 0.37, 0.016), 0, -0.035, -0.005), MAT.metal);
  s("metal", "body", Ce(ft(0.12, 0.075, 0.11, 0.014), 0, 0.005, -0.265), MAT.metal);
  s("shell", "body", Ce(ft(0.124, 0.02, 0.03, 0.005), 0, 0.03, -0.3), MAT.shell);
  s("glow", "body", Ce(ft(0.05, 0.006, 0.003, 0.001), 0, 0, -0.321), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 1.6, 0.4) }), false);

  /* --- 滑橇 + 天线 --- */
  for (const l of [1, -1]) {
    for (let c = 0; c < 4; c++) s("metal", "body", Ce(ft(0.004, 0.01, 0.06, 0.001), l * 0.0885, -0.045 + c * 0.016, -0.06), MAT.metal);
    s("metal", "body", new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(l * 0.075, -0.055, 0.13),
        new THREE.Vector3(l * 0.135, -0.175, 0.16),
        new THREE.Vector3(l * 0.135, -0.192, 0.11),
        new THREE.Vector3(l * 0.135, -0.192, -0.14),
        new THREE.Vector3(l * 0.135, -0.175, -0.19),
        new THREE.Vector3(l * 0.075, -0.055, -0.15),
      ]), 64, 0.0085, 6, false), MAT.metal);
    for (const c of [0.07, -0.1]) s("shell", "body", Ce(Si(0.0135, 0.0135, 0.07, 8), l * 0.135, -0.192, c), MAT.shell);
    s("metal", "body", su([l * 0.04, 0.07, -0.17], [l * 0.085, 0.37, -0.27], 0.004, 0.002, 5), MAT.metal);
    s("metal", "body", Ce(ds(0.008, 0.01, 0.025, 6), l * 0.04, 0.078, -0.17), MAT.metal);
  }
  s("metal", "body", Ce(ds(0.007, 0.007, 0.04, 6), 0, 0.105, 0.1), MAT.metal);
  s("shell", "body", Ce(ds(0.034, 0.036, 0.018, 14), 0, 0.132, 0.1), MAT.shell);
  s("metal", "body", Ce(ft(0.07, 0.03, 0.09, 0.008), 0, -0.075, 0.235), MAT.metal);

  /* --- 旋翼臂 + 护圈 + 桨叶 --- */
  const o = FC();
  for (let l = 0; l < 4; l++) {
    const [c, u, h] = i.rotors[l];
    const f = Math.sign(c);
    const p = Math.sign(h);

    s("metal", "body", su([f * 0.07, 0, p * 0.09], [c, u - 0.05, h], 0.017, 0.015, 8), MAT.metal);
    s("shell", "body", Ce(ft(0.07, 0.045, 0.07, 0.014), f * 0.085, 0, p * 0.1, 0, f * p * 0.74, 0), MAT.shell);
    s("shell", "body", new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(f * 0.09, 0.02, p * 0.12),
        new THREE.Vector3(f * 0.18, 0.012, p * 0.19),
        new THREE.Vector3(c - f * 0.05, u - 0.03, h - p * 0.04),
      ]), 48, 0.005, 5, false), MAT.shell);
    s("metal", "body", Ce(ds(0.04, 0.03, 0.075, 12), c, u - 0.05, h), MAT.metal);
    s("metal", "body", Ce(ds(0.042, 0.042, 0.012, 12), c, u - 0.02, h), MAT.metal);
    s("shell", "body", Ce(o.clone(), c, u, h), MAT.shell);
    s("shell", "body", Ce(new THREE.TorusGeometry(0.196, 0.0085, 6, 28), c, u + 0.036, h, va, 0, 0), MAT.shell);

    for (let v = 0; v < 3; v++) {
      const g = v * 2.094 + 0.5 + l;
      s("metal", "body", Ce(ft(0.145, 0.007, 0.016, 0.002),
        c + Math.cos(g) * 0.105, u - 0.022, h - Math.sin(g) * 0.105, 0, g, 0), MAT.metal);
    }
    for (let v = -1; v <= 1; v++) {
      const g = Math.atan2(p, f) + v * 0.2;
      s("shell", "body", Ce(ft(0.012, 0.05, 0.036, 0.003),
        c + Math.cos(g) * 0.205, u, h + Math.sin(g) * 0.205, 0, -g, 0), v === 0 ? MAT.shell : MAT.metal);
    }

    /* 桨叶挂在 rotor 骨骼下 */
    s("metal", "rotor" + l, Ce(ds(0.017, 0.02, 0.03, 8), 0, -0.002, 0), MAT.metal);
    s("metal", "rotor" + l, Ce(ft(0.158, 0.0035, 0.03, 0.001), 0.088, 0.008, 0, 0.22, 0, 0), MAT.metal);
    s("metal", "rotor" + l, Ce(ft(0.158, 0.0035, 0.03, 0.001), -0.088, 0.008, 0, -0.22, 0, 0), MAT.metal);
    s("shell", "rotor" + l, Ce(ft(0.02, 0.004, 0.031, 0.001), 0.158, 0.008, 0, 0.22, 0, 0), MAT.shell);
    s("shell", "rotor" + l, Ce(ft(0.02, 0.004, 0.031, 0.001), -0.158, 0.008, 0, -0.22, 0, 0), MAT.shell);

    /* 半透明桨盘（透明层） */
    const d = new THREE.RingGeometry(0.03, 0.168, 24, 1);
    d.rotateX(-va);
    t.add("shell", "body", Ce(d, c, u + 0.008, h), MAT.disc, false);
  }

  /* --- 航行灯 --- */
  const strobe = (bone, col, x, z) =>
    s("glow", bone, Ce(new THREE.SphereGeometry(0.012, 8, 6), x, 0.035, z), new THREE.MeshBasicMaterial({ color: new THREE.Color(...col) }), false);
  strobe("strobeR", [10, 0.4, 0.2], 0.545, 0.3);
  strobe("strobeR", [10, 0.4, 0.2], 0.545, -0.3);
  strobe("strobeG", [0.3, 9, 1], -0.545, 0.3);
  strobe("strobeG", [0.3, 9, 1], -0.545, -0.3);
  s("glow", "strobeW", Ce(new THREE.SphereGeometry(0.011, 8, 6), 0, 0.05, -0.325), new THREE.MeshBasicMaterial({ color: 0xffffff }), false);

  /* --- 云台 --- */
  s("metal", "gimbalYaw", Ce(ds(0.036, 0.036, 0.014, 12), 0, -0.004, 0), MAT.metal);
  s("metal", "gimbalYaw", Ce(ft(0.156, 0.01, 0.03, 0.003), 0, -0.014, 0), MAT.metal);
  for (const l of [1, -1]) s("metal", "gimbalYaw", Ce(ft(0.009, 0.075, 0.03, 0.003), l * 0.0735, -0.05, 0), MAT.metal);

  s("metal", "ball", Ce(Ur(0.06, 18, 12), 0, 0, 0), MAT.metal);
  s("metal", "ball", Ce(Ro(0.013, 0.013, 0.142, 8), 0, 0, 0), MAT.metal);
  s("metal", "ball", Ce(Si(0.031, 0.036, 0.03, 14), 0, 0.004, 0.048), MAT.metal);
  s("lens", "ball", Ce(Si(0.025, 0.025, 0.004, 14), 0, 0.004, 0.0645), MAT.lens, false);
  s("metal", "ball", Ce(Si(0.012, 0.012, 0.01, 8), 0.03, 0.036, 0.04), new THREE.MeshStandardMaterial({ color: 0x1a1f33 }));
  s("metal", "ball", Ce(Si(0.019, 0.023, 0.045, 10), i.lamp[0], i.lamp[1], i.lamp[2] - 0.022), MAT.metal);
  s("glow", "lamp", Ce(Si(0.016, 0.016, 0.003, 10), 0, 0, 0.001), new THREE.MeshBasicMaterial({ color: new THREE.Color(11, 9.8, 7.6) }), false);

  /* 探照灯锥（透明层） */
  {
    const cone = new THREE.ConeGeometry(1.25, 9, 20, 6, true);
    cone.translate(0, -9 / 2, 0);
    cone.rotateX(-va);
    t.add("shell", "lamp", cone, MAT.cone, false);
  }

  /* --- 双管枪 --- */
  s("metal", "gun", Ce(ft(0.05, 0.03, 0.05, 0.006), 0, 0.012, 0), MAT.metal);
  s("metal", "gun", Ce(Ro(0.012, 0.012, 0.07, 8), 0, -0.005, 0), MAT.metal);
  s("metal", "gun", Ce(ft(0.052, 0.046, 0.13, 0.008), 0, -0.032, 0), MAT.metal);
  s("shell", "gun", Ce(ft(0.054, 0.012, 0.05, 0.003), 0, -0.02, -0.03), MAT.shell);
  for (const l of [-0.014, 0.014]) {
    s("metal", "gun", Ce(Si(0.0085, 0.0085, 0.2, 8), l, -0.032, 0.16), MAT.metal);
    s("metal", "gun", Ce(Si(0.012, 0.012, 0.03, 8), l, -0.032, 0.255), MAT.metal);
  }
  s("metal", "gun", Ce(ft(0.045, 0.012, 0.012, 0.002), 0, -0.032, 0.2), MAT.metal);
  s("metal", "gun", Ce(ft(0.03, 0.05, 0.05, 0.006), 0.04, -0.035, -0.02), MAT.metal);

  const r = e.build();
  const a = t.build();
  r.extra = a;
  return r;
}

/* ============================================================
 * 7. 实例化 + 动画
 * ============================================================ */
const drone = createDroneModel();
scene.add(drone);
scene.add(drone.extra);

const rotors = [0, 1, 2, 3].map((n) => drone.getObjectByName("rotor" + n));
const gimbalYaw = drone.getObjectByName("gimbalYaw");
const ball = drone.getObjectByName("ball");

const clock = new THREE.Clock();
let t = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  for (const r of rotors) if (r) r.rotation.y += dt * 40;

  if (gimbalYaw) gimbalYaw.rotation.y = Math.sin(t * 0.8) * 0.6;
  if (ball) ball.rotation.x = Math.sin(t * 1.1) * 0.25 - 0.1;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 便于控制台调试 */
window.__drone = drone;
</script>
</body>
</html>
